name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix"
        required: true
        default: "1.1.0"
      publish_release:
        description: "Publish/update GitHub Release"
        required: true
        type: boolean
        default: true
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "meeting_bridge/**"
      - "skills/**"
      - "scripts/**"
      - "installer/**"
      - "tests/**"
      - "run_gui.pyw"
      - "build_exe.ps1"
      - "requirements.txt"
      - "config.example.yaml"
      - ".github/workflows/release-windows.yml"

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Download Russian STT model
        shell: pwsh
        run: python scripts/download_model.py

      - name: Build application
        shell: pwsh
        run: .\build_exe.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Resolve release version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/*") {
            $tag = "${{ github.ref_name }}"
            $version = $tag.TrimStart('v')
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
            $tag = "v$version"
          } else {
            $version = "1.1.${{ github.run_number }}"
            $tag = "v$version"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Version: $version"
          Write-Host "Tag: $tag"

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found at $iscc"
          }
          & $iscc "/DMyAppVersion=$env:APP_VERSION" ".\installer\1C-Analitik.iss"
          if (-not (Test-Path ".\installer\output\1C-Analitik-Setup.exe")) {
            throw "Installer was not created"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1C-Analitik-Setup-${{ env.APP_VERSION }}
          path: installer/output/1C-Analitik-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: "1С Аналитик ${{ env.APP_VERSION }}"
          generate_release_notes: true
          files: installer/output/1C-Analitik-Setup.exe
